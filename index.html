<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StarChat</title>
    <meta name="description" content="Open source IRCv3 client for the web and the desktop.">
    <style>
        :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1d2129; --muted: #5b6270; --link: #2f5fd0; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #14161b; --fg: #e6e8ec; --muted: #9aa1ad; --link: #8fb0ff; }
        }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            padding-inline: 16px; background: var(--bg); color: var(--fg);
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        main { max-width: 34rem; }
        h1 { font-size: 2.5rem; margin: 0 0 .5rem; }
        p { color: var(--muted); }
        a { color: var(--link); }
    </style>
</head>
<body>
<main>
    <h1>StarChat</h1>
    <p>An open source IRCv3 client for the web and the desktop. Works with any IRC network, and networks can offer extra services on top.</p>
    <p>Not released yet. Follow the progress on <a href="https://github.com/starchat-irc/starchat">GitHub</a>.</p>
</main>
</body>
</html>
